name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run the test suite
        # No API key, no network, no VM: the suite uses deterministic policies
        # and a local workspace, so it must pass anywhere.
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: pytest -q

      - name: Exercise the documented demo
        run: python examples/offline_demo/run.py --arm all --out /tmp/demo

      - name: Exercise the documented custom-task flow
        working-directory: examples/custom_task
        run: |
          rsiagent run --task task.py:task --evaluator task.py:evaluator \
            --policies policies.py:policies --arm baseline --out /tmp/ct/base
          rsiagent run --task task.py:task --evaluator task.py:evaluator \
            --policies policies.py:policies --arm rsi --out /tmp/ct/rsi
          rsiagent inspect /tmp/ct/rsi
          rsiagent memory /tmp/ct/rsi

      - name: Check the CLI entry point resolves
        run: |
          rsiagent --version
          python -m rsiagent.cli --help

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
