  <text x="24.0" y="65.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8d8577" text-anchor="start">an environment and an</text>
