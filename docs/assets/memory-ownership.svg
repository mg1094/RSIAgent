  <text x="818.0" y="241.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6f675b" text-anchor="middle">read-only, and its</text>
  <text x="818.0" y="257.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6f675b" text-anchor="middle">edits never sync back</text>
