  <path d="M 721.5 188.9 L 914.0 188.9 Q 922.2 189.1 923.2 198.0 L 923.1 260.5 Q 922.2 268.9 913.8 268.1 L 722.7 268.7 Q 712.4 269.4 712.8 259.3 L 713.1 198.6 Q 713.8 189.1 721.5 188.9 Z" fill="#e4f0e5" stroke="#5b8a63" stroke-width="1.5" stroke-linejoin="round"/>
