  <text x="916.0" y="48.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8d8577" text-anchor="end">The curriculum agent is</text>
  <text x="916.0" y="65.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8d8577" text-anchor="end">handed a snapshot object.</text>
  <text x="916.0" y="82.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8d8577" text-anchor="end">It has no commit() method</text>
  <text x="916.0" y="99.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#8d8577" text-anchor="end">to call.</text>
  <path d="M 790.0 110.0 Q 852.9 108.3 916.0 110.0" fill="none" stroke="#d8d2c4" stroke-width="1.4" stroke-linecap="round"/>
  <text x="470.0" y="446.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#3f3a34" text-anchor="middle">None of these boundaries is a prompt instruction.</text>
  <text x="470.0" y="468.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#92400e" text-anchor="middle">Each is a property of the objects the role is handed.</text>
