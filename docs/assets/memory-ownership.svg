  <text x="470.0" y="98.0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="500" fill="#6f675b" text-anchor="middle">reasoning, or logs</text>
